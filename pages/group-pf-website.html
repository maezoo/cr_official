<style>
.page-portfolio {
    --portfolio-bg: #050505;
    --portfolio-panel: #161616;

    --portfolio-muted: #777;

.page-portfolio *,

.page-portfolio a { color: inherit; text-decoration: none; }

.page-portfolio img { display: block; width: 100%; }
.page-portfolio ul { margin: 0; padding: 0; list-style: none; }
.page-portfolio ::selection { color: #111; background: var(--orange); }
.page-portfolio .container { width: min(1560px, calc(100% - 48px)); margin-inline: auto; }

.page-portfolio .progress { position: fixed; top: 0; left: 0; z-index: 11900; width: 100%; height: 3px; pointer-events: none; }

.page-portfolio .page-intro { position: fixed; inset: 0; z-index: 12000; display: grid; place-items: center; overflow: hidden; pointer-events: none; animation: pfGroupIntroRemove .1s 1.1s forwards; }

.page-portfolio .page-intro::after { position: absolute; inset: 0; background: var(--orange); content: ""; transform-origin: top; animation: pfGroupIntroPanel 1.05s var(--ease) forwards; }

<script>
AOS.init({
    duration: 800,
    easing: 'ease-out',
    once: true,
    offset: 100
});

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const portfolioRoot = document.querySelector('.page-portfolio');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const projectCards = gsap.utils.toArray('.page-portfolio .portfolio-card');
const pageIntro = portfolioRoot?.querySelector('.page-intro');
const heroCount = portfolioRoot?.querySelector('#heroProjectCount');
const visibleCount = portfolioRoot?.querySelector('#visibleProjectCount');
const portfolioCursor = portfolioRoot?.querySelector('.portfolio-cursor');
const pointerGlow = portfolioRoot?.querySelector('.portfolio-pointer-glow');

if(heroCount) heroCount.textContent = projectCards.length;
if(visibleCount) visibleCount.textContent = projectCards.length;

projectCards.forEach(card => {
    const media = card.querySelector('.portfolio-media');
    if(!media) return;
    const wipe = document.createElement('span');
    wipe.className = 'portfolio-card-wipe';
    media.appendChild(wipe);
    const line = document.createElement('span');
    line.className = 'portfolio-card-line';
    card.appendChild(line);
});

const categoryList = portfolioRoot?.querySelector('.glores-A-cate-list');
if(categoryList){
    const activeLink = categoryList.querySelector('li.on a') || categoryList.querySelector('li a');
    const indicator = document.createElement('span');
    indicator.className = 'filter-indicator';
    categoryList.prepend(indicator);

    const moveIndicator = (link, immediate = false) => {
        if(!link || innerWidth <= 767) return;
        const item = link.closest('li');
        gsap.to(indicator, {
            x: item.offsetLeft,
            y: item.offsetTop,
            width: link.offsetWidth,
            height: link.offsetHeight,
            duration: immediate ? 0 : .42,
            ease: 'power3.inOut',
            overwrite: true
        });
    };

    moveIndicator(activeLink, true);
    categoryList.querySelectorAll('li a').forEach(link => {
        link.addEventListener('pointerenter', () => moveIndicator(link));
        link.addEventListener('focus', () => moveIndicator(link));
    });
    categoryList.addEventListener('pointerleave', () => moveIndicator(activeLink));
    addEventListener('resize', () => moveIndicator(activeLink, true));
}

if(!reduceMotion && matchMedia('(pointer:fine)').matches && portfolioCursor && pointerGlow){
    const cursorX = gsap.quickTo(portfolioCursor, 'x', { duration: .18, ease: 'power3.out' });
    const cursorY = gsap.quickTo(portfolioCursor, 'y', { duration: .18, ease: 'power3.out' });
    const glowX = gsap.quickTo(pointerGlow, 'x', { duration: .8, ease: 'power3.out' });
    const glowY = gsap.quickTo(pointerGlow, 'y', { duration: .8, ease: 'power3.out' });

    addEventListener('pointermove', event => {
        cursorX(event.clientX);
        cursorY(event.clientY);
        glowX(event.clientX);
        glowY(event.clientY);
        gsap.to(pointerGlow, { opacity: 1, duration: .5 });
    });

    projectCards.forEach(card => {
        const media = card.querySelector('.portfolio-media');
        const image = media?.querySelector('img');
        if(!media) return;

        media.addEventListener('pointerenter', () => {
            gsap.to(portfolioCursor, { opacity: 1, scale: 1, duration: .3, ease: 'back.out(1.8)' });
        });
        media.addEventListener('pointerleave', () => {
            gsap.to(portfolioCursor, { opacity: 0, scale: .65, duration: .22 });
            if(image) gsap.to(image, { x: 0, y: 0, scale: 1, duration: .7, ease: 'power3.out' });
        });
        media.addEventListener('pointermove', event => {
            if(!image) return;
            const rect = media.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width - .5;
            const y = (event.clientY - rect.top) / rect.height - .5;
            gsap.to(image, { x: x * 14, y: y * 14, scale: 1.045, duration: .55, ease: 'power3.out' });
        });
    });
}

function revealCards(batch){
    batch.forEach((card, index) => {
        const media = card.querySelector('.portfolio-media');
        const image = media?.querySelector('img');
        const wipe = card.querySelector('.portfolio-card-wipe');
        const texts = [card.querySelector('small'), card.querySelector('.portfolio-name'), card.querySelector('p')].filter(Boolean);
        const line = card.querySelector('.portfolio-card-line');
        const timeline = gsap.timeline({ delay: index * .13 });

        timeline
            .to(card, { opacity: 1, y: 0, duration: .01 })
            .to(wipe, { yPercent: -102, duration: .82, ease: 'power4.inOut' });

        if(image) timeline.to(image, { scale: 1, duration: 1.05, ease: 'power3.out' }, '<');
        timeline
            .to(texts, { opacity: 1, y: 0, stagger: .07, duration: .48, ease: 'power3.out' }, '-=.38')
            .to(line, { width: '100%', duration: .55, ease: 'power3.out' }, '-=.3');
    });
}

let motionStarted = false;
function startPortfolioMotion(){
    if(motionStarted || reduceMotion) return;
    motionStarted = true;

    gsap.to('.page-portfolio .portfolio-hero-curtain', { yPercent: -101, duration: .9, ease: 'power4.inOut' });

    const counter = { value: 0 };
    gsap.to(counter, {
        value: projectCards.length,
        duration: 1.15,
        ease: 'power3.out',
        onUpdate: () => {
            const value = Math.round(counter.value);
            if(heroCount) heroCount.textContent = value;
        }
    });

    const heroTimeline = gsap.timeline({ delay: .12 });
    heroTimeline
        .fromTo('.page-portfolio .portfolio-eyebrow', { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .6, ease: 'power3.out' })
        .fromTo('.page-portfolio .portfolio-hero h1', { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .95, ease: 'power4.out' }, '-=.25')
        .fromTo('.page-portfolio .portfolio-hero-copy', { y: 25, opacity: 0 }, { y: 0, opacity: 1, duration: .65, ease: 'power3.out' }, '-=.55');

    ScrollTrigger.batch(projectCards, {
        start: 'top 91%',
        once: true,
        interval: .12,
        batchMax: 4,
        onEnter: revealCards
    });
    ScrollTrigger.refresh();
}

if(!reduceMotion){
    gsap.set(projectCards, { y: 55, opacity: 0 });
    gsap.set('.page-portfolio .portfolio-card .portfolio-media img', { scale: 1.09 });
    gsap.set('.page-portfolio .portfolio-card small, .page-portfolio .portfolio-name, .page-portfolio .portfolio-card p', { y: 18, opacity: 0 });
    gsap.set('.page-portfolio .portfolio-eyebrow, .page-portfolio .portfolio-hero h1, .page-portfolio .portfolio-hero-copy', { opacity: 0 });
    if(heroCount) heroCount.textContent = '0';

    if(pageIntro){
        const handleIntroEnd = event => {
            if(event.target === pageIntro && event.animationName === 'pfGroupIntroRemove'){
                pageIntro.removeEventListener('animationend', handleIntroEnd);
                startPortfolioMotion();
            }
        };
        pageIntro.addEventListener('animationend', handleIntroEnd);
        setTimeout(startPortfolioMotion, 1400);
    }else{
        startPortfolioMotion();
    }
}else{
    portfolioRoot?.querySelector('.portfolio-hero-curtain')?.remove();
    portfolioRoot?.querySelectorAll('.portfolio-card-wipe').forEach(element => element.remove());
}

const progressBar = portfolioRoot?.querySelector('.progress span');
const syncProgress = () => {
    if(!progressBar) return;
    const max = document.documentElement.scrollHeight - innerHeight;
    progressBar.style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
};
syncProgress();
addEventListener('scroll', syncProgress, { passive: true });
</script>
