.site-header.is-scrolled{padding-top:12px}.site-header.is-scrolled .header-shell{height:68px;padding:0 18px 0 22px;background:rgba(7,7,7,.82);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.26);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.site-header.is-scrolled .main-nav .dep1>li>a::after{bottom:15px}

@media(max-width:1180px){.site-header{padding-right:28px;padding-left:28px}.header-shell{gap:24px}.main-nav .dep1{gap:2px}.main-nav .dep1>li>a{padding-right:12px;padding-left:12px;font-size:13px}.main-nav .dep1>li.has-submenu>a{padding-right:30px}.main-nav .dep1>li.has-submenu>a::before{right:13px}.main-nav .dep1>li>a::after{right:12px;left:12px}.header-cta{padding:0 14px}}

.site-header{padding:0 15px}.header-shell{height:76px}.site-header.is-scrolled{padding-top:8px}.site-header.is-scrolled .header-shell{height:62px;padding:0 10px 0 18px;border-radius:15px}.mobile-menu-btn{z-index:5;display:block}
.menu-backdrop{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;padding:0;border:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s}body.menu-open .menu-backdrop{opacity:1;visibility:visible;pointer-events:auto}
.main-nav{position:fixed;inset:0 0 0 auto;z-index:3;display:block;width:min(92vw,420px);height:100dvh;margin:0;padding:88px 24px 112px;background:#080808;border-left:1px solid rgba(255,255,255,.1);box-shadow:-30px 0 80px rgba(0,0,0,.38);overflow-y:auto;overscroll-behavior:contain;transform:translateX(105%);transition:transform .55s var(--ease)}.main-nav::before{content:"MENU";display:block;margin-bottom:18px;color:#555;font-size:10px;font-weight:900;letter-spacing:.2em}body.menu-open .main-nav{transform:translateX(0)}
.main-nav>[id^="pm2-"]{width:100%;height:auto!important}.main-nav .dep1{display:block;width:100%;height:auto}.main-nav .dep1>li{position:relative;display:block;width:100%;height:auto;border-bottom:1px solid rgba(255,255,255,.09)}.main-nav .dep1>li>a,.main-nav .dep1>li.has-submenu>a{display:block;width:100%;height:auto;padding:18px 52px 18px 2px;color:rgba(255,255,255,.78);font-size:18px;font-weight:780;line-height:1.35}.main-nav .dep1>li.on>a,.main-nav .dep1>li.submenu-open>a{color:#fff}.main-nav .dep1>li>a::before,.main-nav .dep1>li>a::after{display:none}
.mobile-submenu-toggle{position:absolute;top:9px;right:0;z-index:2;display:block;width:42px;height:42px;padding:0;border:1px solid transparent;border-radius:50%;background:transparent;color:#777;cursor:pointer}.mobile-submenu-toggle::before{content:"";position:absolute;top:14px;left:16px;width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:.35s var(--ease)}.mobile-submenu-toggle[aria-expanded="true"]{background:rgba(255,146,48,.08);border-color:rgba(255,146,48,.2);color:var(--orange)}.mobile-submenu-toggle[aria-expanded="true"]::before{top:18px;transform:rotate(225deg)}
.main-nav .dep1>li>div{position:static;display:block;width:100%;max-height:0;padding:0;opacity:1;visibility:visible;overflow:hidden;transform:none;transition:max-height .5s var(--ease),padding-bottom .4s var(--ease)}.main-nav .dep1>li.submenu-open>div{max-height:520px;padding-bottom:14px}
.main-nav .dep2{position:static;display:block;width:100%;min-width:0;margin:0;padding:7px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.075);border-radius:13px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}.main-nav .dep2::before{display:none}.main-nav .dep2>li{width:100%;margin:0}.main-nav .dep2>li+li{margin-top:2px}.main-nav .dep2>li>a,.main-nav .dep2>li>a:hover,.main-nav .dep2>li.on>a{display:block;width:100%;padding:11px 34px 11px 13px;background:transparent;border:0;border-radius:8px;color:#8d8d8d;font-size:13px;text-align:left}.main-nav .dep2>li>a:hover,.main-nav .dep2>li.on>a{background:rgba(255,146,48,.09);color:#fff}.main-nav .dep2>li>a::after{right:13px;display:block}

<header class="site-header" id="siteHeader">
	<button class="menu-backdrop" type="button" aria-label="메뉴 닫기"></button>
	<div class="header-shell">
		<a class="header-logo" href="creafit_main_custom_why_060_0055_auto_portfolio_drag.html" aria-label="CREAFIT 메인으로">CREAFIT<span>.</span></a>
		<nav class="main-nav" id="mainNav" aria-label="주요 메뉴">
			{GROUP_re_lnb_ha}
		</nav>
		<a class="header-cta" href="/shop_contents/myreg_form.htm?myreg_code=inquiry">PROJECT REQUEST <i class="ri-arrow-right-up-line"></i></a>
		<button class="mobile-menu-btn" type="button" aria-label="메뉴 열기" aria-controls="mainNav" aria-expanded="false"><span></span><span></span></button>
	</div>
</header>
<script>
(()=>{
	const init=()=>{
		const header=document.querySelector("#siteHeader");
		if(!header||header.dataset.initialized==="true")return;
		const button=header.querySelector(".mobile-menu-btn");
		const backdrop=header.querySelector(".menu-backdrop");
		const nav=header.querySelector("#mainNav");
		header.dataset.initialized="true";
		const sync=()=>header.classList.toggle("is-scrolled",scrollY>28);
		const close=()=>{document.body.classList.remove("menu-open");button?.setAttribute("aria-expanded","false");button?.setAttribute("aria-label","메뉴 열기")};
		sync();
		addEventListener("scroll",sync,{passive:true});
		button?.addEventListener("click",()=>{const open=document.body.classList.toggle("menu-open");button.setAttribute("aria-expanded",String(open));button.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기")});
		backdrop?.addEventListener("click",close);
		nav?.querySelectorAll(".dep1>li").forEach(item=>{
			const panel=item.querySelector(":scope>div");
			const link=item.querySelector(":scope>a");
			if(!panel||!link)return;
			item.classList.add("has-submenu");
			const toggle=document.createElement("button");
			const opened=item.classList.contains("on");
			toggle.type="button";
			toggle.className="mobile-submenu-toggle";
			toggle.setAttribute("aria-label",`${link.textContent.trim()} 하위 메뉴`);
			toggle.setAttribute("aria-expanded",String(opened));
			if(opened)item.classList.add("submenu-open");
			toggle.addEventListener("click",()=>{
				const willOpen=!item.classList.contains("submenu-open");
				nav.querySelectorAll(".dep1>li.submenu-open").forEach(openItem=>{if(openItem===item)return;openItem.classList.remove("submenu-open");openItem.querySelector(":scope>.mobile-submenu-toggle")?.setAttribute("aria-expanded","false")});
				item.classList.toggle("submenu-open",willOpen);
				toggle.setAttribute("aria-expanded",String(willOpen));
			});
			item.insertBefore(toggle,panel);
		});
		nav?.addEventListener("click",event=>{if(innerWidth<=900&&event.target.closest("a"))close()});
		addEventListener("resize",()=>{if(innerWidth>900)close()});
		addEventListener("keydown",event=>{if(event.key==="Escape")close()});
		nav?.querySelectorAll(".dep1>li.on>a,.dep2>li.on>a").forEach(link=>link.setAttribute("aria-current","page"));
		document.dispatchEvent(new CustomEvent("site-header:ready"));
	};
	document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init,{once:true}):init();
})();
</script>
