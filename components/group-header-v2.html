<header class="site-header" id="siteHeader">
  <button class="menu-backdrop" type="button" aria-label="메뉴 닫기"></button>
  <div class="header-shell">
    <a class="header-logo" href="creafit_main_custom_why_060_0055_auto_portfolio_drag.html" aria-label="CREAFIT 메인으로">CREAFIT<span>.</span></a>
    <nav class="main-nav" id="mainNav" aria-label="주요 메뉴">
      {GROUP_re_lnb_ha}
    </nav>
    <a class="header-cta" href="/shop_contents/myreg_form.htm?myreg_code=inquiry">PROJECT REQUEST <i class="ri-arrow-right-up-line"></i></a>
    <button class="mobile-menu-btn" type="button" aria-label="메뉴 열기" aria-controls="mainNav" aria-expanded="false"><span></span><span></span></button>
  </div>
</header>
<script>
(()=>{
  const init=()=>{
    const header=document.querySelector("#siteHeader");
    const button=header?.querySelector(".mobile-menu-btn");
    const backdrop=header?.querySelector(".menu-backdrop");
    const nav=header?.querySelector("#mainNav");
    if(!header||header.dataset.initialized==="true")return;
    header.dataset.initialized="true";
    const sync=()=>header.classList.toggle("is-scrolled",scrollY>28);
    const close=()=>{
      document.body.classList.remove("menu-open");
      button?.setAttribute("aria-expanded","false");
      button?.setAttribute("aria-label","메뉴 열기");
    };
    sync();
    addEventListener("scroll",sync,{passive:true});
    button?.addEventListener("click",()=>{
      const open=document.body.classList.toggle("menu-open");
      button.setAttribute("aria-expanded",String(open));
      button.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기");
    });
    backdrop?.addEventListener("click",close);
    nav?.querySelectorAll(".dep1 > li").forEach(item=>{
      const panel=item.querySelector(":scope > div");
      const link=item.querySelector(":scope > a");
      if(!panel||!link)return;
      const toggle=document.createElement("button");
      const opened=item.classList.contains("on");
      toggle.type="button";
      toggle.className="mobile-submenu-toggle";
      toggle.setAttribute("aria-label",`${link.textContent.trim()} 하위 메뉴`);
      toggle.setAttribute("aria-expanded",String(opened));
      if(opened)item.classList.add("submenu-open");
      toggle.addEventListener("click",()=>{
        const willOpen=!item.classList.contains("submenu-open");
        nav.querySelectorAll(".dep1 > li.submenu-open").forEach(openItem=>{
          if(openItem===item)return;
          openItem.classList.remove("submenu-open");
          openItem.querySelector(":scope > .mobile-submenu-toggle")?.setAttribute("aria-expanded","false");
        });
        item.classList.toggle("submenu-open",willOpen);
        const open=willOpen;
        toggle.setAttribute("aria-expanded",String(open));
      });
      item.insertBefore(toggle,panel);
    });
    nav?.addEventListener("click",event=>{if(innerWidth<=900&&event.target.closest("a"))close()});
    addEventListener("resize",()=>{if(innerWidth>900)close()});
    addEventListener("keydown",event=>{if(event.key==="Escape")close()});
    nav?.querySelectorAll(".dep1 > li.on > a,.dep2 > li.on > a").forEach(link=>link.setAttribute("aria-current","page"));
    document.dispatchEvent(new CustomEvent("site-header:ready"));
  };
  document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init,{once:true}):init();
})();
</script>
